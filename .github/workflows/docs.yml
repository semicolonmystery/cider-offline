name: Docs

# Build the mdBook in docs/ and publish it with GitHub Pages at
# https://cider-offline.podik.cz/docs/ . The site root only redirects to /docs/.
#
# Repository setup (once): Settings > Pages > Source: "GitHub Actions", and the
# custom domain cider-offline.podik.cz. The CNAME file below documents the
# domain; with Actions-based Pages the domain set in the settings is the one
# that counts.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Only the minimum: read the code, deploy to Pages with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The official release binary: no Rust toolchain or compile needed.
      - name: Install mdBook
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: |
          set -euo pipefail
          mdbook --version
          mdbook build docs --dest-dir "$GITHUB_WORKSPACE/_site/docs"

      # The site root: a redirect to the book, and the custom domain.
      - name: Add root redirect and CNAME
        run: |
          set -euo pipefail
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Cider Offline</title>
            <meta http-equiv="refresh" content="0; url=/docs/">
            <link rel="canonical" href="/docs/">
          </head>
          <body>
            <p><a href="/docs/">Cider Offline documentation</a></p>
          </body>
          </html>
          EOF
          printf '%s\n' 'cider-offline.podik.cz' > _site/CNAME
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
