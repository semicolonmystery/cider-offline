[package]
name = "cider-offline"
description = "Desktop app that keeps the Cider music client working offline through a local caching HTTPS proxy"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords = ["cider", "apple-music", "offline", "proxy", "music"]
categories = ["gui", "multimedia::audio", "network-programming"]

[dependencies]
anyhow = "1.0.104"
# Unreleased fixes 09aa127 (XDG Exec quoting, #39) and 8408d6f (Windows Run-key
# quoting); switch back to the next crates.io release after 0.6.0.
auto-launch = { git = "https://github.com/zzzgydi/auto-launch", rev = "e2feaffbdb6d8992bf1ddc8d5ec99e915ebbe1ed" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cider-offline-core = { version = "0.1.0", path = "../core" }
cider-offline-download = { version = "0.1.0", path = "../download" }
cider-offline-trust = { version = "0.1.0", path = "../trust" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
interprocess = "2.4.8"
opener = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rfd = "0.18.0"
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030", "raw-window-handle-06"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

# Same as [workspace.lints] except `unsafe_code` is `deny` instead of `forbid`:
# Slint's generated code needs a scoped `#[allow(unsafe_code)]` (src/ui/mod.rs),
# which `forbid` rejects. Keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
slint-build = "1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "libc"] }
objc2-foundation = "0.3.2"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

# Used by `cargo generate-rpm -p crates/app` (Linux CI only). Paths are relative
# to the workspace root, where generate-rpm is run. The removal scripts go
# where cargo-packager puts its `resources` in the .deb / AppImage / pacman
# package (`/usr/lib/<main binary>/`), so all Linux packages match.
[package.metadata.generate-rpm]
assets = [
  { source = "target/release/cider-offline", dest = "/usr/bin/cider-offline", mode = "755" },
  { source = "packaging/desktop/cider-offline.desktop", dest = "/usr/share/applications/cider-offline.desktop", mode = "644" },
  { source = "packaging/icons/16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/sh.cider-offline.CiderOffline.png", mode = "644" },
  { source = "packaging/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/sh.cider-offline.CiderOffline.png", mode = "644" },
  { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/sh.cider-offline.CiderOffline.png", mode = "644" },
  { source = "packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/sh.cider-offline.CiderOffline.png", mode = "644" },
  { source = "packaging/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/sh.cider-offline.CiderOffline.png", mode = "644" },
  { source = "packaging/scripts/remove-ca-linux.sh", dest = "/usr/lib/cider-offline/scripts/remove-ca-linux.sh", mode = "755" },
  { source = "packaging/scripts/remove-ca-macos.sh", dest = "/usr/lib/cider-offline/scripts/remove-ca-macos.sh", mode = "755" },
  { source = "packaging/scripts/remove-ca-windows.ps1", dest = "/usr/lib/cider-offline/scripts/remove-ca-windows.ps1", mode = "644" },
]

[package.metadata.generate-rpm.requires]
nss-tools = "*"
polkit = "*"
xdg-utils = "*"
libxkbcommon = "*"
fontconfig = "*"
mesa-libGL = "*"
mesa-libEGL = "*"
libwayland-client = "*"
libX11 = "*"
