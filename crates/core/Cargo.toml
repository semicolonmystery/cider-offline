[package]
name = "cider-offline-core"
description = "Proxy engine for Cider Offline: HTTPS interception, offline responses, library storage, lyrics and media cache"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords = ["cider", "apple-music", "proxy", "offline", "cache"]
categories = ["network-programming", "caching", "multimedia::audio"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
cider-offline-trust = { version = "0.1.0", path = "../trust" }
directories = "6.0.0"
flate2 = "1.1.11"
http-body-util = "0.1.5"
hudsucker = "0.25.0"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "gzip", "json", "query", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
toml = "1.2.1"
tracing = "0.1.44"
unicode-normalization = "0.1.26"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }
