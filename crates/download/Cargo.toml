[package]
name = "cider-offline-download"
description = "Widevine DRM downloader for Cider Offline"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords = ["cider", "apple-music", "widevine", "download", "audio"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
cider-offline-core = { version = "0.1.0", path = "../core" }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["fs", "macros", "rt"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
rsa = { version = "0.10", features = ["sha1"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
aes = "0.9"
ctr = "0.10"
cbc = "0.2"
base64 = "0.22"
rand = "0.9"
m3u8-rs = "6"
url = "2"
cmac = "0.8.0"
tempfile = "3.27.0"

[lints]
workspace = true

[dev-dependencies]
wiremock = "0.6.5"
