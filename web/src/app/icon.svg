<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- App icon: a single eighth note whose flag turns down into a download arrow, flat white on the amber-to-raspberry tile. Original artwork for this project. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E2145A"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="92" cy="180" rx="36" ry="28" transform="rotate(-22 92 180)" stroke="none"/>
    <path d="M115 176 V64 H176 V124" fill="none" stroke-width="26"/>
    <path d="M142 124 L210 124 L176 168 Z" stroke-width="12"/>
  </g>
</svg>
